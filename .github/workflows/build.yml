name: Build Test

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release

jobs:
  build_natives:
    strategy:
      matrix:
        platform:
          - os: ubuntu-24.04
            key: linux-amd64
          - os: ubuntu-24.04-arm
            key: linux-aarch64
          - os: macos-15
            key: macos-aarch64
    name: Build natives (${{matrix.platform.key}})
    runs-on: ${{matrix.platform.os}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          cache: pnpm

      - name: Install dependencies (Linux)
        if: contains(matrix.platform.key, 'linux')
        run: sudo apt update && sudo apt install -y cmake libvips-dev liblqr-1-0-dev libzxing-dev
      - name: Install dependencies (macOS)
        if: contains(matrix.platform.key, 'macos')
        run: brew install liblqr vips

      - name: Record native dependency versions
        id: nativedeps
        run: |
          versions="$(pkg-config --modversion vips-cpp lqr-1 2>/dev/null | tr '\n' '-' || true)"
          echo "versions=${versions:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache built natives
        id: natives
        uses: actions/cache@v6
        with:
          path: build/Release/esmbmedia.node
          # Exact match only, no restore-keys: a partial hit would leave a stale
          # binary in place. Keyed on the sources cmake actually compiles plus
          # the versions of the system libraries they link against, so a libvips
          # or liblqr bump on the runner still forces a rebuild.
          key: natives-${{ matrix.platform.key }}-${{ steps.nativedeps.outputs.versions }}-${{ hashFiles('natives/**', 'CMakeLists.txt', 'package.json') }}

      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Build natives
        if: steps.natives.outputs.cache-hit != 'true'
        run: pnpm run build:natives
      # Always run: this is the only workflow that type-checks the TypeScript.
      - name: Build TypeScript
        run: pnpm run build:ts
      - name: Upload natives
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.platform.key}}
          path: build/Release/esmbmedia.node
